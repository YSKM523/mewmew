name: iOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "ios/**"
      - "core/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

  ios-build:
    name: iOS build and snapshots
    needs: rust-check
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust XCFramework and Swift bindings
        run: core/build-swift.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          device="$(xcrun simctl list devices available \
            | grep -oE '^ +iPhone [^(]+' | sed -E 's/^ +//; s/ +$//' | head -1)"
          if [ -z "$device" ]; then
            echo "::error::No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $device"
          echo "DESTINATION=platform=iOS Simulator,name=$device,OS=latest" >> "$GITHUB_ENV"

      - name: Build and run snapshot tests
        working-directory: ios
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/MewmewDerivedData
          SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.spm-cache
          MEWMEW_APP_TOKEN: ${{ secrets.MEWMEW_APP_TOKEN }}
        run: |
          if [ -d "MewmewTests/__Snapshots__" ]; then
            SNAPSHOT_RECORD=0 xcodebuild \
              -project Mewmew.xcodeproj \
              -scheme Mewmew \
              -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              test
          else
            record_status=0
            SNAPSHOT_RECORD=1 xcodebuild \
              -project Mewmew.xcodeproj \
              -scheme Mewmew \
              -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              test || record_status=$?

            if [ "$record_status" -eq 0 ]; then
              echo "::warning::Snapshot recording pass unexpectedly returned success."
            fi

            SNAPSHOT_RECORD=0 xcodebuild \
              -project Mewmew.xcodeproj \
              -scheme Mewmew \
              -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building
          fi

      - name: Verify the app token reached the bundle
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/MewmewDerivedData
        run: |
          # A missing token makes ParseClient a no-op *silently* by design, so
          # the only place this can be caught is here, against the real bundle.
          # Must be the app's own plist: Mewmew.app also embeds the xctest
          # bundle's Info.plist, which never carries app build settings.
          plist="$(find "$DERIVED_DATA_PATH/Build/Products" \
            -path "*/Mewmew.app/Info.plist" | head -1)"
          if [ -z "$plist" ]; then
            echo "::error::Could not find the built Mewmew.app Info.plist"
            exit 1
          fi
          if ! plutil -extract MewmewAppToken raw "$plist" >/dev/null 2>&1; then
            echo "::error::MewmewAppToken is absent from the built Info.plist;" \
                 "the INFOPLIST_KEY_ route did not carry the value through"
            plutil -p "$plist" | head -40
            exit 1
          fi
          echo "MewmewAppToken present in the bundle"

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mewmew-ios-snapshots
          path: ios/MewmewTests/__Snapshots__/
          if-no-files-found: warn
          retention-days: 14

  testflight:
    name: TestFlight upload
    needs: ios-build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    # Serialize uploads: two concurrent runs would read the same latest build
    # number and collide on upload.
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          missing=0
          for secret_name in \
            APPSTORE_KEY_ID \
            APPSTORE_ISSUER_ID \
            APPSTORE_P8 \
            APPSTORE_TEAM_ID \
            MATCH_PASSWORD \
            MATCH_DEPLOY_KEY
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required secret: $secret_name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Start SSH agent for match repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Trust GitHub SSH host keys
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install Rust with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Rust XCFramework and Swift bindings
        run: core/build-swift.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Create temporary signing keychain
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/mewmew-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"

          echo "MATCH_KEYCHAIN_NAME=$keychain_path" >> "$GITHUB_ENV"
          echo "MATCH_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MEWMEW_APP_TOKEN: ${{ secrets.MEWMEW_APP_TOKEN }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
        run: bundle exec fastlane beta

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${MATCH_KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "$MATCH_KEYCHAIN_NAME"
          fi
