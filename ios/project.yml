name: Mewmew

options:
  minimumXcodeGenVersion: 2.42.0
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.12.0

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Mewmew:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mewmew
      - path: ../core/build/swift/bindings/mewmew_core.swift
        group: Generated
    dependencies:
      - framework: ../core/build/swift/MewmewCore.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tensorproxies.mewmew
        PRODUCT_NAME: Mewmew
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Mewmew
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    preBuildScripts:
      - name: Build Rust core for Swift
        script: |
          "$SRCROOT/../core/build-swift.sh"
        basedOnDependencyAnalysis: false

  MewmewTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MewmewTests
        excludes:
          - __Snapshots__
    dependencies:
      - target: Mewmew
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tensorproxies.mewmew.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mewmew.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mewmew"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Mewmew:
    build:
      targets:
        Mewmew: all
        MewmewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MewmewTests
    archive:
      config: Release
